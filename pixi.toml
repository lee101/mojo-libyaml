[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
name = "mojo-libyaml"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"
# The box runs many jobs at once; keep BLAS from exhausting the process limit.
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"

[dependencies]
mojo = "==1.2.0.dev2026092905"
python = "3.13.*"
pytest = "*"
numpy = "*"
pyyaml = "*"
